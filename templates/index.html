{% extends "base.html" %}
{% block title %}Home - Budjet {% endblock %}
{% block card_class %}home-card{% endblock %}
{% block content %} 
<h1>Welcome to Budjet!</h1>
<div>
    <form action="/add_transaction" method="post">
        <label>Amount: </label>
        <input type="number" name="amount" required><br><br>

        <label>Main Category:</label>
        <select name="main_category" required>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Fees">Fees</option>
            <option value="Clothes">Clothes</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Health">Health</option>
            <option value="Home">Home</option>
            <option value="Bills">Bills</option>
            <option value="Gifts">Gifts</option>
            <option value="Savings">Savings</option>
            <option value="Others">Others</option>
        </select>
        <br><br>

        <label>Category: </label>
        <input type="text" name="category" required><br><br>

        <label>Add Note: </label>
        <input type="text" name="note"><br><br>

        <button type="submit" class="btn">Add Transaction</button>
    </form>


    <!-- for personalized stickers only create images folders and upload stickers !!
    <div class="sticker" style="top:10px; left:10px;">
        <img src="{{ url_for('static', filename='images/dollars_note_image.png') }}" alt="sticker">
    </div>

    <div class="sticker" style="bottom:10px; right:15px;">
        <img src="{{ url_for('static', filename='images/wecanhelpu_image.png') }}" alt="sticker">
    </div> 
    -->

    <a href="/history" class="btn secondary" >View History</a>
</div>

{% endblock %}
