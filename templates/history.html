<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History</title>
</head>
<body>
    <h1>Transaction History</h1>
    <table border="1" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Date</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Note</th>
        </tr>
        {% for t in transactions %}
        <tr>
            <td>{{ t[0] }}</td> <!-- ID -->
            <td>{{ t[1] }}</td> <!-- Date -->
            <td>{{ t[2] }}</td> <!-- Category -->
            <td>{{ t[3] }}</td> <!-- Amount -->
            <td>{{ t[4] }}</td> <!-- Note -->
        </tr>
        {% endfor %}


        <tr>
            <td colspan="3"><strong>Total</strong></td>
            <td colspan="2">{{ total_amount }}</td>
        </tr>

        <a href="/">Add New Transaction</a>
    </table>
</body>
</html>
